name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and publish (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sign the update bundles so the in-app updater accepts them. Add these
          # two repo secrets (Settings → Secrets and variables → Actions):
          #   TAURI_SIGNING_PRIVATE_KEY          = contents of src-tauri/updater-signing.key
          #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD = the key password
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Moorix ${{ github.ref_name }}"
          releaseBody: |
            Desktop build of Moorix.

            Downloads:
            - Windows: `.exe` (NSIS)
            - macOS: `.dmg` (Apple Silicon and Intel)
            - Linux: `.AppImage` / `.deb`

            Mobile (Android/iOS) is not part of this release.
          # Generate + upload latest.json so the auto-updater can read it.
          includeUpdaterJson: true
          # Must be a full (published, non-prerelease) release: the updater's
          # `releases/latest/download/latest.json` endpoint ignores drafts and
          # prereleases. Auto-publishes on tag push (delete the release if bad).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
