[package]
name = "moorix"
version = "0.1.0-pre.12"
description = "Moorix — cross-platform terminal & SSH client"
authors = ["Hammam Oktajianto"]
license-file = "../LICENSE"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "moorix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2"
tokio = { version = "1", features = ["macros", "sync", "io-util", "time"] }
tauri-plugin-store = "2"
sha2 = "0.10"
aes-gcm = "0.11.0"
pbkdf2 = "0.12"
getrandom = "0.3"
tiny_http = "0.12.0"
reqwest = { version = "0.13.4", features = ["form", "json", "query"] }

# Desktop-only backends. Local PTY (portable-pty) and the OS keychain (keyring)
# have no mobile implementation — mobile is SSH-only with an in-memory secret
# store (see secrets.rs). `desktop`/`mobile` are Tauri cfg aliases and can't be
# used in Cargo target tables, so gate on the target OS instead.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
portable-pty = "0.9"
serialport = "4"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
# Auto-update from GitHub Releases (desktop only; mobile updates via app stores).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

